<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Run Board</title>
<meta name="description" content="Who is most likely to homer today, with hits, total bases, starter strikeouts and game odds next to DraftKings and Kalshi.">
<meta name="theme-color" content="#0C1511">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F7F3E8'/%3E%3Cpath d='M7 6c4 5 4 15 0 20M25 6c-4 5-4 15 0 20' stroke='%23D83A34' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0C1511; --panel:#131F1A; --panel2:#1A2A23; --panel3:#22362D; --line:#2A3F35; --ink:#EEF3EC; --ink2:#B7C6BC; --ink3:#7F9488;
  --grass:#3FBF7F; --grass-ink:#0C1511; --amber:#FFB547; --red:#F0625A; --blue:#6EB6FF; --chalk:#F7F3E8;
  --good:#46C983; --bad:#F0625A; --meter:#FFB547; --meter-bg:#22362D;
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --font-d:"Oswald","Arial Narrow",Impact,sans-serif; --font-b:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif; --font-m:"Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F4F1E8; --panel:#FFFFFF; --panel2:#EFEBDF; --panel3:#E3DDCC; --line:#DDD6C4; --ink:#15211B; --ink2:#44564B; --ink3:#78887E;
  --grass:#1F7A4A; --grass-ink:#FFFFFF; --amber:#B86E00; --red:#C0342C; --blue:#1F63B0; --chalk:#15211B;
  --good:#1F7A4A; --bad:#C0342C; --meter:#D98200; --meter-bg:#EFEBDF; --shadow:0 12px 32px rgba(40,40,20,.12); color-scheme:light; }}
:root[data-theme="light"]{
  --bg:#F4F1E8; --panel:#FFFFFF; --panel2:#EFEBDF; --panel3:#E3DDCC; --line:#DDD6C4; --ink:#15211B; --ink2:#44564B; --ink3:#78887E;
  --grass:#1F7A4A; --grass-ink:#FFFFFF; --amber:#B86E00; --red:#C0342C; --blue:#1F63B0; --chalk:#15211B;
  --good:#1F7A4A; --bad:#C0342C; --meter:#D98200; --meter-bg:#EFEBDF; --shadow:0 12px 32px rgba(40,40,20,.12); color-scheme:light; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
a{color:var(--blue)}
[hidden]{display:none!important}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:34px;height:34px;flex:0 0 auto}
.logo h1{margin:0;font-family:var(--font-d);font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1;white-space:nowrap}
.logo h1 span{color:var(--amber)}
.bar2row{max-width:1180px;margin:0 auto;padding:6px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar2row .sub{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
.days{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.days button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.days button[aria-pressed="true"]{background:var(--grass);color:var(--grass-ink)}
.iconbtn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);flex:0 0 auto}
.iconbtn svg{width:17px;height:17px}
.live{font-family:var(--font-m);font-size:11px;color:var(--ink3);white-space:nowrap;cursor:pointer;background:none;border:0;padding:4px 0}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:1px}
.live.ok::before{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.live.busy::before{background:var(--amber)}
.live.err::before{background:var(--bad)}
nav.tabs{max-width:1180px;margin:0 auto;padding:8px 10px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 12px 10px;font-family:var(--font-d);font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabdot{display:inline-block;background:var(--good);color:var(--grass-ink);border-radius:9px;font-size:11px;padding:1px 6px;vertical-align:1px}

main{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.lede{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin:4px 0 14px}
.lede h2{margin:0;font-family:var(--font-d);font-weight:600;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.lede p{margin:4px 0 0;color:var(--ink2);font-size:14px;max-width:720px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.controls select,.controls input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;min-width:0}
.controls input[type=search]{flex:1 1 160px;max-width:260px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--grass);margin:0}
.note{font-size:13px;color:var(--ink3)}
.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14px;color:var(--ink2)}

/* hero strip */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--font-d);font-size:28px;font-weight:600;line-height:1.1;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--ink2)}

/* HR list */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.homered{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.row{display:grid;grid-template-columns:34px 48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.rank{font-family:var(--font-d);font-size:22px;color:var(--ink3);text-align:center}
.card:nth-child(-n+3) .rank{color:var(--amber)}
.face{width:48px;height:48px;border-radius:50%;background:var(--panel2);object-fit:cover;object-position:top;border:1px solid var(--line)}
.who{min-width:0}
.who .nm{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:6px}
.who .mt{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);vertical-align:1px;white-space:nowrap}
.pill.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good)}
.pill.proj{border-style:dashed}
.pill.out{border-color:var(--bad);color:var(--bad)}
.pill.hr{background:var(--good);color:var(--grass-ink);border-color:var(--good)}
.pill.live{border-color:var(--red);color:var(--red)}
.big{text-align:right;min-width:76px}
.big .p{font-family:var(--font-d);font-size:30px;font-weight:600;line-height:1}
.big .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.meter{height:4px;background:var(--meter-bg);border-radius:4px;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--meter);border-radius:4px}
.sub{padding:0 12px 10px 104px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12.5px;padding:3px 8px;border-radius:8px;background:var(--panel2);color:var(--ink2);white-space:nowrap}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.chip.hot{background:color-mix(in srgb,var(--red) 16%,var(--panel2));color:var(--ink)}
.mk{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px;white-space:nowrap}
.mk span{padding:3px 7px}
.mk span:first-child{background:var(--panel2);color:var(--ink3);font-weight:700;font-size:11px;letter-spacing:.04em;display:flex;align-items:center}
.edge{font-family:var(--font-m);font-size:12px;padding:3px 7px;border-radius:8px;white-space:nowrap}
.edge.pos{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.edge.neg{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.edge.flat{background:var(--panel2);color:var(--ink3)}
.detail{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;background:color-mix(in srgb,var(--panel2) 40%,var(--panel))}
.detail h4{margin:0 0 6px;font-family:var(--font-d);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--ink2)}
.kv span:nth-child(even){font-family:var(--font-m);text-align:right}
.bar2{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13px}
.bar2 .t{height:6px;border-radius:6px;background:var(--meter-bg);overflow:hidden;grid-column:1/-1}
.bar2 .t i{display:block;height:100%;background:var(--grass)}
.more{display:block;margin:14px auto 0;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;cursor:pointer;color:var(--ink2)}

/* tables */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;background:var(--panel);position:sticky;top:0;cursor:pointer}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
td .mini{display:flex;align-items:center;gap:8px}
td .mini img{width:28px;height:28px;border-radius:50%;background:var(--panel2);object-fit:cover;object-position:top}
td small{color:var(--ink3)}
td.who2{white-space:normal;min-width:170px;line-height:1.25}
@media (max-width:640px){ td.who2{min-width:140px;position:sticky;left:0;background:var(--panel);z-index:1} th:first-child{position:sticky;left:0;z-index:2} table{font-size:13.5px} th,td{padding:7px 8px} }
.heat{border-radius:6px;padding:2px 6px;font-family:var(--font-m)}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink3)}
.teamline{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center}
.teamline img{width:30px;height:30px}
.teamline .tn{font-weight:700;font-size:16px;line-height:1.1}
.teamline .tn small{display:block;font-weight:400;font-size:12.5px;color:var(--ink3)}
.teamline .sc{font-family:var(--font-d);font-size:24px;min-width:26px;text-align:right}
.wp{font-family:var(--font-d);font-size:22px;text-align:right;min-width:60px}
.wpbar{display:flex;height:8px;border-radius:8px;overflow:hidden;background:var(--meter-bg)}
.wpbar i{display:block;height:100%}
.odds{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;font-size:13px;align-items:center}
.odds .h{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.odds .src{color:var(--ink2);font-weight:600}
.odds .c{font-family:var(--font-m);text-align:right}
.gfoot{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:12.5px;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--ink)}

/* where to bet */
a.buy{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
a.buy span{padding:3px 7px;display:flex;align-items:center}
a.buy span:first-child{background:var(--panel2);color:var(--ink3);font-weight:700;font-size:11px;letter-spacing:.03em}
a.buy.best{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
a.buy.best span:first-child{background:var(--good);color:var(--grass-ink)}
a.buy:hover{background:var(--panel2)}
a.buy .ext{color:var(--ink3);font-size:11px;padding-left:0}
.buybox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13.5px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--panel)}
.btn.primary{background:var(--grass);border-color:var(--grass);color:var(--grass-ink)}
.wtb{font-size:13px}
.wtb table{font-size:13px}
.tablewrap td a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink3)}
td.best{background:color-mix(in srgb,var(--good) 16%,transparent);font-weight:700}
.wtb td.best{background:color-mix(in srgb,var(--good) 16%,transparent);font-weight:700}
.wtb td a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink3)}
.wtb summary{cursor:pointer;color:var(--ink2);font-size:13px;padding:4px 0}
.bestline{display:flex;flex-direction:column;gap:4px;font-size:13px}
.bestline a{color:var(--ink);text-decoration:none}
.bestline a b{color:var(--good)}
.age{font-size:11.5px;color:var(--ink3)}

/* best bets */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1b1300}
.verdict{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.verdict.v2{background:var(--good);color:var(--grass-ink)}
.verdict.v1{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.verdict.v0{background:var(--panel2);color:var(--ink3)}
.vb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.vb.v2{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.vb .t{font-weight:700;font-size:16px;line-height:1.25}
.vb .t small{font-weight:500;color:var(--ink3);font-size:13px}
.vb .ev{text-align:right}
.vb .ev b{display:block;font-family:var(--font-d);font-size:26px;font-weight:600;line-height:1}
.vb .ev span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.vb .nums{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vb .nums div{background:var(--panel2);border-radius:8px;padding:6px 8px;min-width:0}
.vb .nums div span{display:block;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb .nums div b{font-family:var(--font-m);font-size:14px}
.vb .nums div.hl{background:color-mix(in srgb,var(--good) 16%,var(--panel2))}
.vb .why{grid-column:1/-1;font-size:13px;color:var(--ink2)}
.chance{grid-column:1/-1;display:grid;gap:4px;margin:2px 0}
.chance .cr{display:grid;grid-template-columns:92px minmax(0,240px) 46px;align-items:center;gap:9px}
.chance .cr>span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.chance .tr{background:var(--panel2);border-radius:5px;height:11px;overflow:hidden}
.chance .tr i{display:block;height:100%;border-radius:5px;background:var(--ink3);opacity:.55}
.chance .cr>b{font-family:var(--font-m);font-size:13.5px;text-align:right}
.chance .me .tr i{background:var(--good);opacity:1}
.chance .me>b{color:var(--good)}
.vb .bet1{grid-column:1/-1;font-size:13.5px;color:var(--ink);background:var(--panel2);border-radius:8px;padding:8px 10px}
@media (max-width:640px){ .chance .cr{grid-template-columns:76px minmax(0,1fr) 42px;gap:7px} }
.vb .buys{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:0 0 14px}
.legend div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.legend b{color:var(--ink);display:block;font-size:13.5px;margin-bottom:2px}
.odds-t th:first-child,.odds-t td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
.odds-t td.worst{color:var(--ink3)}
@media (max-width:640px){ .vb .nums{grid-template-columns:repeat(2,minmax(0,1fr))} .vb .ev b{font-size:21px} .vb .ev span{font-size:10px} .vb .t{font-size:15px} }

/* scorecard */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h3{margin:0 0 4px;font-family:var(--font-d);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.panel p{margin:4px 0 10px;color:var(--ink2);font-size:14px}
.daylist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.daylist .d{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.daylist .d b{min-width:74px}
.tick{padding:1px 6px;border-radius:6px;background:var(--panel2);white-space:nowrap}
.tick.y{background:var(--good);color:var(--grass-ink)}
svg.chart{width:100%;height:auto;display:block}
.prose{max-width:760px}
.prose h3{font-family:var(--font-d);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 6px}
.prose p,.prose li{color:var(--ink2)}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--ink3);font-size:12.5px}

@media (max-width:640px){
  .bar{padding:8px 12px 0;gap:8px}
  .logo h1{font-size:20px}
  .bar2row{padding:6px 12px 0}
  .days button{padding:4px 10px;font-size:12.5px}
  .wide{display:none}
  .logo svg{width:28px;height:28px}
  main{padding:12px 12px 50px}
  .row{grid-template-columns:24px 40px minmax(0,1fr) auto;gap:8px;padding:10px}
  .face{width:40px;height:40px}

<script>
"use strict";
/* ============================================================ state */
const HR = window.HR || null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k, d) { try { const v = localStorage.getItem("hrb:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("hrb:" + k, JSON.stringify(v)); } catch (e) {} } };
const TABS = [["hr", "Home runs"], ["value", "Best bets"], ["arb", "Arbitrage"], ["hits", "Hits & bases"], ["ks", "Strikeouts"], ["games", "Games & odds"], ["card", "Scorecard"], ["how", "How it works"]];
const S = { day: 0, tab: store.get("tab", "hr"), game: "", q: "", confirmed: store.get("confirmed", false), sort: "model", show: 30,
            open: new Set(), live: { state: "", at: null, err: "" }, homered: {}, liveLines: {}, liveProps: {}, inGame: {}, startedPk: new Set(),
            ks: {}, ksAt: null, ksSrc: "", pm: {}, pmMl: {}, pmTot: {}, pmAt: null, pmTok: {}, pmBook: {} };
const MD = HR ? HR.model : null;
const ORDER = ["out", "k", "bb", "s1", "xb", "hr"], IK = 1, IS1 = 3, IXB = 4, IHR = 5;

/* ============================================================ the model, in the browser */
const CURVE = MD ? Object.keys(MD.curve).map(Number).sort((a, b) => a - b) : [];
const CURVEV = MD ? CURVE.map(k => MD.curve[String(k)]) : [];
const RESID = MD ? Object.keys(MD.resid).map(Number).sort((a, b) => a - b) : [];
const clip = (x, a, b) => Math.min(b, Math.max(a, x));
function rint(x) { const f = Math.floor(x), d = x - f; if (Math.abs(d - 0.5) < 1e-9) return f % 2 === 0 ? f : f + 1; return Math.round(x); }

function interp(x) {

function wShare(idx, bf) { return interp(clip(rint(idx - bf), -30, 25)); }
function wxFeat(g) {

}
function paProbs(z, f) { return softmax(z.map((v, i) => v + MD.c_temp[i] * f[0] + MD.c_wind[i] * f[1])); }
function batterGame(Psp, Pbp, slot, home, bf) {
  let noHr = 1, noH = 1, eHr = 0, ePa = 0, eK = 0, t0 = 1, t1 = 0, t2 = 0, w3 = 0;
  for (let k = 1; k <= 7; k++) {

    const n0 = t0 * (1 - qk * (p1 + p2)), n1 = t1 * (1 - qk * (p1 + p2)) + t0 * qk * p1, n2 = t2 + t1 * qk * (p1 + p2) + t0 * qk * p2;

}

  const pbf = new Map();
  RESID.forEach((o, i) => { const b = clip(rint(bf + o), 1, 45); pbf.set(b, (pbf.get(b) || 0) + pr[i] / tot); });

  const maxbf = Math.max(...pbf.keys());

    for (let m = 1; m <= MAXK; m++) nd[m] += dist[m - 1] * p;

}
function baseRuns(r) {

    12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

  let win = 0, tie = 0; const tot = new Array(61).fill(0);
  for (let i = 0; i < ph.length; i++) for (let j = 0; j < pa.length; j++) {
    const v = ph[i] * pa[j]; if (i > j) win += v; else if (i === j) tie += v; tot[i + j] += v;

/* ============================================================ derive everything for a slate */
function slate() { return HR.slates[S.day]; }
function gameMap(sl) { const m = {}; sl.games.forEach(g => m[g.pk] = g); return m; }
function lineupOf(sl, pk, team) {
  const hs = sl.hitters.filter(h => h.pk === pk && h.t === team && h._P);
  if (hs.some(h => h.lp)) return hs.filter(h => h.il).sort((a, b) => a.sl - b.sl);
  return hs.slice().sort((a, b) => (b.ps - a.ps) || (a.sl - b.sl) || (a.id - b.id)).slice(0, 9).sort((a, b) => (a.sl - b.sl) || (a.id - b.id));
}
function compute(sl) {
  const G = gameMap(sl), cal = MD.calib;
  for (const h of sl.hitters) {
    const g = G[h.pk]; const f = wxFeat(g);
    if (!h.zsp || h.zsp.some(v => v == null)) { h._P = null; continue; }
    const Psp = paProbs(h.zsp, f), Pbp = paProbs(h.zbp, f);
    h._P = [Psp, Pbp];
    const r = batterGame(Psp, Pbp, h.sl, h.h, h.bf);
    h._r = r;
    h._hrIf = platt(r.hr, cal.hr); h._hitIf = platt(r.hit, cal.hit); h._tbIf = platt(r.tb2, cal.tb2);
    h._hr = h._hrIf * h.ps; h._hit = h._hitIf * h.ps; h._tb2 = h._tbIf * h.ps;
  }
  for (const p of sl.pitchers) {
    const lu = lineupOf(sl, p.pk, p.vs);
    if (lu.length < 9) { p._ek = p.ek; p._ge = p.ge; continue; }
    const res = pitcherKs(lu.map(h => h._P[0][IK]), p.bf);
    p._ek = res.ek; p._ge = {}; for (const n in res.ge) p._ge[n] = platt(res.ge[n], cal.k);
    p._lu = lu;
  }
  for (const g of sl.games) {
    const mu = {};
    for (const side of ["home", "away"]) {
      const lu = lineupOf(sl, g.pk, g[side].abbr);
      if (lu.length < 9) continue;
      const share = clip(lu[0].bf / 38.5, 0.2, 0.95); let sw = 0; const rates = [0, 0, 0, 0, 0, 0];
      for (const h of lu) { const e = h._r.ePa; sw += e; for (let i = 0; i < 6; i++) rates[i] += e * (share * h._P[0][i] + (1 - share) * h._P[1][i]); }
      mu[side] = MD.runs.a + MD.runs.b * baseRuns(rates.map(v => v / sw));
    }
    if (mu.home != null && mu.away != null) {
      const w = winProb(mu.home, mu.away);
      g._m = { muH: mu.home, muA: mu.away, pHome: w.pHome, total: w.total };
    } else g._m = null;
  }
}

/* ============================================================ helpers */
const pct = (p, d = 0) => p == null || isNaN(p) ? "–" : (100 * p).toFixed(d) + "%";
const f1 = x => x == null || isNaN(x) ? "–" : (+x).toFixed(1);
const amer = p => { if (p == null || p <= 0 || p >= 1) return "–"; return p >= 0.5 ? "−" + Math.round(100 * p / (1 - p)) : "+" + Math.round(100 * (1 - p) / p); };
const amerStr = o => o == null ? "–" : String(o).replace("-", "−");
const amerP = o => { const v = parseFloat(String(o).replace("+", "").replace("−", "-")); if (!isFinite(v) || v === 0) return null; return v > 0 ? 100 / (v + 100) : -v / (-v + 100); };
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const head = id => `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_96,q_auto:good/v1/people/${id}/headshot/67/current`;
const logo = id => `https://www.mlbstatic.com/team-logos/${id}.svg`;
const tfmt = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const dfmt = d => new Date(d + "T12:00:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
function ago(iso) { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " hr ago" : Math.round(m / 1440) + " d ago"; }
function spOf(g, side) { return g[side].sp_name ? g[side].sp_name : "TBD"; }
function oppSp(sl, h) { const g = gameMap(sl)[h.pk]; const side = h.h ? "away" : "home"; return { name: g[side].sp_name || "TBD", id: g[side].sp, g }; }
function mkv(h, src, key) { const m = (h.mk || {})[src]; return m && m[key] ? m[key] : null; }
function preTag(sl, pk) { const g = gameMap(sl)[pk]; const m = g && g.mk || {}; return m.pregame_as_of ? `pre-game prices from ${tfmt(m.pregame_as_of)}` : m.no_pregame ? "no pre-game prices captured" : ""; }
function liveDk(h, key) { const lp = S.liveProps[h.id]; if (lp && lp[key] && !S.startedPk.has(h.pk)) return lp[key]; return mkv(h, "dk", key); }

/* ---------- price shopping: what one bet costs at each site, and where it pays the most */
const SERIES_OF = k => k.startsWith("hr") ? "hr" : k.startsWith("hit") ? "hit" : k.startsWith("tb") ? "tb" : "k";
function ksFee(p, series) {
  const m = ((slate().markets || {}).ks_fee || {})[series]; const mult = m == null ? 1 : m;
  if (!(p > 0 && p < 1)) return 0;
  return Math.ceil(Math.round(100 * 0.07 * mult * p * (1 - p) * 1e6) / 1e6) / 100;
}
const costToAmer = c => c == null || !(c > 0 && c < 1) ? "–" : c >= 0.5 ? "−" + Math.round(100 * c / (1 - c)) : "+" + Math.round(100 * (1 - c) / c);
const cents = c => c == null ? "–" : (c * 100 < 10 ? (c * 100).toFixed(1).replace(/\.0$/, "") : Math.round(c * 100)) + "¢";
function ksQuote(entry, series) {
  // entry: [mid, bid, ask, ticker]; live prices (relay or the 20-minute file) win over the build's
  if (!entry) return null;
  const live = entry[3] ? S.ks[entry[3]] : null;
  const ask = live ? live[1] : entry[2];
  if (!(ask > 0 && ask < 1)) return null;
  const fee = ksFee(ask, series);
  return { ask, fee, cost: Math.min(ask + fee, 0.999), mid: live ? (live[0] != null && live[1] != null ? (live[0] + live[1]) / 2 : live[2]) : entry[0], live: !!live };
}
function pmFee(p) { const r = (VCFG && VCFG.pm_fee) || 0.05; return p > 0 && p < 1 ? Math.floor(r * p * (1 - p) * 1e5 + 0.5) / 1e5 : 0; }

function pmQuote(entry) {

  const ask = live ? live[1] : entry[1];

}
function playerOffers(sl, who, key) {
  const g = gameMap(sl)[who.pk], gm = g.mk || {}, series = SERIES_OF(key), out = [];
  const dk = liveDk(who, key);
  if (dk && dk[1] != null) out.push({ site: "DraftKings", short: "DK", cost: dk[1], label: amerStr(dk[0]), link: (gm.dk || {}).url || "https://sportsbook.draftkings.com/leagues/baseball/mlb" });
  const kq = ksQuote(mkv(who, "ks", key), series);
  if (kq) out.push({ site: "Kalshi", short: "KALSHI", cost: kq.cost, label: cents(kq.cost), link: ((gm.ks || {}).urls || {})[series] || "https://kalshi.com/sports/baseball",
                     note: `Cheapest bet: 1 contract at ${cents(kq.ask)} + ${cents(kq.fee)} fee = ${cents(kq.ask + kq.fee)}, pays $1.00 (${costToAmer(kq.cost)})`, kq });
  const pq = pmQuote(mkv(who, "pm", key));
  if (pq) out.push({ site: "Polymarket", short: "POLY", cost: pq.cost, label: cents(pq.cost), link: (gm.pm || {}).props_url || (gm.pm || {}).url,
                     note: `1 share at ${cents(pq.ask)} + ${cents(pq.fee)} fee = ${cents(pq.cost)}, pays $1.00 (${costToAmer(pq.cost)})`, pq });

}
function buyChip(o, best) {
  return `<a class="buy ${best ? "best" : ""}" href="${esc(o.link)}" target="_blank" rel="noopener" title="${esc((o.note || o.site + " " + o.label) + " · opens " + o.site)}"><span>${best ? "BEST · " : ""}${o.short}</span><span class="num">${esc(o.label)}${o.short !== "DK" ? " · " + costToAmer(o.cost) : ""}</span><span class="ext">↗</span></a>`;
}
function offersHtml(offers, model) {

  if (h.lp && h.il) return `<span class="pill ok">Batting ${ord(h.sl)}</span>`;
  if (h.lp && !h.il) return `<span class="pill out">Not in lineup</span>`;

}
function gameState(g) {

  if (g.state === "Live") return `${g.half ? g.half.slice(0, 3) + " " : ""}${g.inning || ""} · ${g.away.abbr} ${g.away.score ?? 0}–${g.home.score ?? 0}`;

  const g = gameMap(sl)[h.pk], sk = h.sk || {}, out = [];
  const pf = sk.pf; if (pf != null) { if (pf >= 1.08) out.push(["up", `Park +${Math.round((pf - 1) * 100)}% HR`]); else if (pf <= 0.92) out.push(["down", `Park −${Math.round((1 - pf) * 100)}% HR`]); }

    if (w.out != null && w.out <= -6) out.push(["down", `Wind in ${Math.round(-w.out)} mph`]);
    if (w.temp != null && w.temp >= 85) out.push(["up", `${Math.round(w.temp)}° heat`]);
    if (w.temp != null && w.temp <= 55) out.push(["down", `${Math.round(w.temp)}° chill`]);

  if (sk.p_hr != null && sk.lg_hr && sk.p_hr >= 1.2 * sk.lg_hr && h.sp) out.push(["up", `SP gives up HR (${f1(sk.p_hr)}/600 vs ${h.st}HB)`]);
  if (sk.p_hr != null && sk.lg_hr && sk.p_hr <= 0.8 * sk.lg_hr && h.sp) out.push(["down", `SP limits HR`]);
  if (sk.p_gb != null && sk.p_gb <= 37 && h.sp) out.push(["up", `Fly-ball SP (${sk.p_gb}% GB)`]);
  if (sk.p_gb != null && sk.p_gb >= 50 && h.sp) out.push(["down", `Ground-ball SP (${sk.p_gb}% GB)`]);
  if (h.b !== "S" && h.spt && h.b !== h.spt && h.sp) out.push(["up", `Platoon edge vs ${h.spt}HP`]);
  if (h.b !== "S" && h.spt && h.b === h.spt && h.sp) out.push(["down", `Same-side SP (${h.spt}HP)`]);

function calChart(cal) {
  if (!cal.length) return "";
  const W = 320, H = 200, P = 34, mx = 0.32;
  const x = v => P + (W - P - 10) * v / mx, y = v => H - P - (H - P - 10) * v / mx;
  const pts = cal.map(b => `<circle cx="${x(b.predicted)}" cy="${y(b.actual)}" r="${3 + Math.sqrt(b.n) / 12}" fill="var(--amber)" opacity=".85"><title>${pct(b.predicted, 1)} predicted · ${pct(b.actual, 1)} actual · ${b.n} games</title></circle>`).join("");
  const ticks = [0, .1, .2, .3].map(t => `<text x="${x(t)}" y="${H - P + 16}" fill="var(--ink3)" font-size="10" text-anchor="middle">${t * 100}%</text><text x="${P - 6}" y="${y(t) + 3}" fill="var(--ink3)" font-size="10" text-anchor="end">${t * 100}%</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration chart">
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(mx)}" y2="${y(mx)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <line x1="${P}" y1="${H - P}" x2="${W - 10}" y2="${H - P}" stroke="var(--line)"/><line x1="${P}" y1="10" x2="${P}" y2="${H - P}" stroke="var(--line)"/>
    ${ticks}${pts}<text x="${W - 10}" y="${H - 4}" fill="var(--ink3)" font-size="10" text-anchor="end">model chance →</text>
    <text x="4" y="12" fill="var(--ink3)" font-size="10">actual</text></svg>`;
}

/* ============================================================ view: how it works */
function viewHow() {
  const rep = MD.report || {};
  return `<div class="prose">
    <div class="lede"><div><h2>How it works</h2></div></div>
    <p>Every plate appearance ends one of six ways: strikeout, walk (or hit by pitch), single, double or triple, home run, or some other out. The model gives each of those a chance for every hitter against every pitcher, then plays them out over the game.</p>
    <h3>1. The hitter and the pitcher</h3>
    <p>Each player's rates come from this season before today plus 80% of last season and 50% of the season before, pulled toward league average until there is enough of a sample to trust. For power that means home runs, <b>barrels</b> (the best-struck balls: 98+ mph at a launch angle that usually leaves the park), <b>pulled fly balls and line drives</b>, balls hit 95+ mph and bat speed. For the pitcher: home runs, barrels and fly balls allowed, split by the side the batter hits from. Batter-vs-pitcher history is ignored; it is too small to mean anything.</p>
    <h3>2. The setting</h3>
    <p>Statcast park factors for each batter side (Yankee Stadium plays very differently for lefties), the first-pitch temperature, and the wind blowing toward or away from the outfield. Warmer air and wind blowing out both add carry; the model learned how much from three seasons of games.</p>
    <h3>3. The game</h3>
    <p>Where a hitter bats sets how many trips he gets (a leadoff man averages about 4.5, a nine-hole hitter about 3.5). How deep the starter usually goes sets how many of those trips come against him and how many against that club's bullpen. Until lineups are posted, each hitter is projected from his club's last few weeks and his number is scaled by the chance he starts.</p>
    <h3>4. Checking itself</h3>
    <p>The final numbers are recalibrated against games the model had not seen. Over the 2026 season (fitted on 2024–25 only), the top pick each day homered ${pct(rep.top && rep.top["1"] ? rep.top["1"].hit_rate : null)} of the time and the top ten ${pct(rep.top && rep.top["10"] ? rep.top["10"].hit_rate : null)}, against ${pct(rep.hr ? rep.hr.base : null)} for the average starter. Even the best pick misses about three times in four; a home run is a rare event.</p>
    <h3>Where to bet</h3>
    <p>Every bet shows the cheapest place to buy it right now, with a link that opens that site. Prices are compared as what a $1 payout costs, so a sportsbook's American odds, a Kalshi contract and a Polymarket share line up on one scale.</p>
    <ul>
      <li><b>DraftKings</b>: game lines and player bets from ESPN's public odds feed, refreshed on this page. Player-bet prices include the book's margin. Links open the DraftKings game page, with the pick already on the bet slip for game lines.</li>
      <li><b>Kalshi</b>: the price shown is what one contract costs right now (the cheapest bet you can place), plus Kalshi's trading fee, and it pays $1 if it hits. Kalshi does not let web pages read its prices, so they come ${HR.relay ? "through a small relay, live" : "from a job that refreshes them about every 20 minutes"}; the page says how old they are. The link opens that game's market on Kalshi.</li>
      <li><b>Polymarket</b>: one share's current asking price, pays $1, read live. Shown only when the market is actually trading.</li>
      <li><b>FanDuel, BetMGM, Caesars, Fanatics, BetRivers, theScore Bet, Hard Rock, Novig, ProphetX</b>: moneyline, run line and total ${(HR.books_status || {}).configured ? "from The Odds API, a few times a day" : "appear once an Odds API key is added"}. Player bets from these books need a paid plan, so they are not shown.</li>
    </ul>
    <h3>Best bets</h3>
    <p>Each card on the <b>Best bets</b> tab puts three numbers on one scale: <b>break even</b> (how often the best price needs it to hit just to return your stake), <b>market says</b> (every site's own odds with the margin taken out, averaged), and <b>our model</b>. The dollar figure is what a $10 bet returns on average over the long run, with Kalshi's and Polymarket's taker fees inside the price, and the line under the bars says what that bet actually pays and how long a shot it is.</p>
    <p>The verdict is driven by <b>price against the market</b>, not by the model against the market. The first four graded days (842 hitter-games, 94 starts, 222 settled picks) said so plainly: the weight that best combines our model with the markets is close to zero for every bet type, and the further the model sat above the market on a pick, the worse the pick did (under 1.15× the market's odds the picks returned +62%; over 2× they lost 81%). Picking on disagreement picks the model's mistakes. So <b>Value</b> now means the cheapest site is selling the bet under the market's own number by 2% or more; the model is a ${Math.round(100 * VCFG.w.hr)}% tilt on homers and ${Math.round(100 * VCFG.w.ml)}% on moneylines; and anything where the model is ${VCFG.cap_ratio}× the market's odds or more is marked <i>Market disagrees</i> and gets no verdict. Every pick is still logged before first pitch and graded on the Scorecard, so these settings get refit as the record grows.</p>
    <p>"Pts" or "edge" elsewhere is the model's chance minus the best price. Markets know things the model does not (late scratches, injuries, weather), so a big gap is a question, not a sure thing. Which sites you can use depends on your state.</p>
    <h3>Arbitrage</h3>
    <p>The <b>Arbitrage</b> tab looks for the same bet priced at two sites in a way that lets you buy both sides for less than the dollar they pay. On Kalshi and Polymarket you can buy either side outright: "yes" costs the ask, and the other side costs one minus the bid. Add each site's taker fee (Kalshi ${(100 * ACFG.ks_rate).toFixed(0)}¢ × its baseball multiplier × contracts × price × (1 − price), rounded up to the next cent on the order; Polymarket ${(100 * ACFG.pm_rate).toFixed(0)}¢ × shares × price × (1 − price)), and if the pair still comes to under $1 the difference is locked whatever happens on the field. Sportsbooks can join the pair too, priced by their odds with no fee on top.</p>
    <p>It is usually empty, which is the honest answer: two exchanges quoting the same game watch each other, and the fees alone eat about a point. When something does show, the page walks both order books at build time to say how much could really go on, not just what the top of the book advertises, and it lists what can still break the lock: Kalshi refunds a scratched hitter at a fair price while Polymarket settles him Under, a washed-out game pays 50-50 on Polymarket and a fair price on Kalshi, and the second leg has to still be there when you click it.</p>
    <h3>What it does not know</h3>
    <ul><li>Injuries or rest days announced after the build, until the lineup posts.</li><li>Opener or bullpen games beyond what the listed starter usually does.</li><li>Umpires and catcher framing.</li><li>Hot streaks: tested on the 2026 season, the last 14 days of barrels, hard contact and homers did not improve the forecast by a measurable amount, so they are shown but not scored.</li></ul>
    <p class="note">Built from Baseball Savant, the MLB Stats API, Open-Meteo, ESPN and Kalshi's public data. For fun and research, not betting advice.</p>
  </div>`;
}

/* ============================================================ events */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-day],[data-tab],[data-open],[data-more],[data-vmode],[data-aex],#livebtn,#theme");
  if (!t) return;
  if (t.dataset.day != null) { S.day = +t.dataset.day; S.game = ""; S.show = 30; render(); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; store.set("tab", S.tab); S.show = 30; render(); window.scrollTo({ top: 0 }); }
  else if (t.dataset.open) { S.open.has(t.dataset.open) ? S.open.delete(t.dataset.open) : S.open.add(t.dataset.open); render(); }
  else if (t.dataset.more) { S.show += 30; render(); }
  else if (t.dataset.vmode) { S.vmode = t.dataset.vmode; S.show = 30; render(); }
  else if (t.dataset.aex) { S.aex = t.dataset.aex === "1"; render(); }
  else if (t.id === "livebtn") { refresh(true); }
  else if (t.id === "theme") {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    const nx = cur === "light" ? "dark" : "light"; document.documentElement.dataset.theme = nx; store.set("theme", nx);
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "game") { S.game = t.value; render(); }
  else if (t.id === "vkind") { S.vkind = t.value; S.show = 30; render(); }
  else if (t.id === "sort") { S.sort = t.value; render(); }
  else if (t.id === "hsort") { S.hsort = t.value; render(); }
  else if (t.id === "confirmed") { S.confirmed = t.checked; store.set("confirmed", S.confirmed); render(); }
});
let qTimer = null;
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  S.q = e.target.value; clearTimeout(qTimer);
  qTimer = setTimeout(() => { render(); const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250);
});

/* ============================================================ live layer */
const MLB = "https://statsapi.mlb.com/api/v1";
async function jget(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(r.status + " " + u); return r.json(); }
function windOut(fromDeg, az, mph) { if (fromDeg == null || az == null || mph == null) return 0; const toward = (fromDeg + 180) % 360; return mph * Math.cos((toward - az) * Math.PI / 180); }
const MLBWIND = { "out to cf": 1, "out to lf": .7, "out to rf": .7, "in from cf": -1, "in from lf": -.7, "in from rf": -.7 };
async function liveSchedule(sl) {
  const j = await jget(`${MLB}/schedule?sportId=1&date=${sl.date}&gameType=R&hydrate=probablePitcher,lineups,weather,linescore`);
  const games = (j.dates[0] || {}).games || [];
  const G = gameMap(sl);
  for (const x of games) {
    const g = G[x.gamePk]; if (!g) continue;
    g.state = x.status.abstractGameState; g.status = x.status.detailedState;
    if (g.state !== "Preview") S.startedPk.add(g.pk);
    g.home.score = x.teams.home.score; g.away.score = x.teams.away.score;
    const ls = x.linescore || {}; g.inning = ls.currentInningOrdinal; g.half = ls.inningHalf;
    for (const side of ["home", "away"]) {
      const pp = x.teams[side].probablePitcher;
      if (pp && pp.id !== g[side].sp) { g.flags = g.flags || {}; g.flags[side] = `Probable changed to ${pp.fullName}; numbers still use ${g[side].sp_name || "TBD"}`; }
      const lu = ((x.lineups || {})[side + "Players"] || []).map(p => p.id);
      if (lu.length) {
        const team = g[side].abbr;
        for (const h of sl.hitters.filter(h => h.pk === g.pk && h.t === team)) {
          const i = lu.indexOf(h.id); h.lp = true; h.il = i >= 0; if (i >= 0) { h.sl = i + 1; h.ps = 1; } else h.ps = 0;
        }
      }
    }
    const w = x.weather || {};
    if (w.temp && g.wx) {
      const m = /(\d+)\s*mph,?\s*(.*)/i.exec(w.wind || ""); const cond = (w.condition || "").toLowerCase();
      g.wx.temp = +w.temp; g.wx.src = "MLB"; g.wx.cond = w.condition;
      if (cond === "dome" || cond === "roof closed") { g.wx.indoor = true; g.wx.roof = w.condition; }
      else if (g.geo && g.geo.roof === "Retractable") { g.wx.indoor = false; g.wx.roof = "roof open"; }
      if (m && !g.wx.indoor) { g.wx.wind = +m[1]; g.wx.out = +m[1] * (MLBWIND[m[2].trim().toLowerCase()] || 0); }
    }
  }
  return games;
}
async function liveWeather(sl) {
  const need = sl.games.filter(g => g.state === "Preview" && g.geo && g.geo.lat != null && (!g.wx || g.wx.src !== "MLB") && g.geo.roof !== "Dome");
  if (!need.length) return;
  const lat = need.map(g => g.geo.lat).join(","), lon = need.map(g => g.geo.lon).join(",");
  const j = await jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation_probability&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=GMT&forecast_days=3`);
  const arr = Array.isArray(j) ? j : [j];
  need.forEach((g, n) => {
    const h = (arr[n] || {}).hourly; if (!h) return;
    const t = new Date(g.time); t.setUTCMinutes(0, 0, 0);
    const key = t.toISOString().slice(0, 13) + ":00"; const i = h.time.indexOf(key); if (i < 0) return;
    const sl3 = a => a.slice(i, i + 3).filter(v => v != null);
    const avg = a => { const s = sl3(a); return s.length ? s.reduce((x, y) => x + y, 0) / s.length : null; };
    const temp = avg(h.temperature_2m), mph = avg(h.wind_speed_10m), rain = Math.max(0, ...sl3(h.precipitation_probability));
    g.wx = g.wx || {};
    let indoor = false;
    if (g.geo.roof === "Retractable") indoor = rain >= 35 || (temp != null && (temp >= 88 || temp <= 55));
    Object.assign(g.wx, { temp, wind: mph, rain, src: "live", indoor, roof: g.geo.roof === "Retractable" ? (indoor ? "roof likely closed" : "roof likely open") : "",
      out: indoor ? 0 : windOut(h.wind_direction_10m[i], g.geo.az, mph) });
  });
}
async function liveHomers(sl, games) {
  const live = games.filter(x => ["Live", "Final"].includes(x.status.abstractGameState));
  await Promise.all(live.map(async x => {
    try {
      const b = await jget(`${MLB}/game/${x.gamePk}/boxscore`);
      for (const side of ["home", "away"]) for (const k in b.teams[side].players) {
        const p = b.teams[side].players[k]; const hr = ((p.stats || {}).batting || {}).homeRuns;
        if (hr) S.homered[p.person.id] = hr;
      }
    } catch (e) {}
  }));
}
async function liveOdds(sl) {
  // ESPN's core odds feed (CORS-open): provider 100 is DraftKings' pre-game line, 200 is DraftKings live
  const withId = sl.games.filter(g => g.mk && g.mk.dk && g.mk.dk.espn_id);
  await Promise.all(withId.map(async g => {
    const eid = g.mk.dk.espn_id;
    try {
      const j = await jget(`https://sports.core.api.espn.com/v2/sports/baseball/leagues/mlb/events/${eid}/competitions/${eid}/odds`);
      for (const it of j.items || []) {
        const pid = String((it.provider || {}).id), H = it.homeTeamOdds || {}, A = it.awayTeamOdds || {};
        const ph = amerP(H.moneyLine), pa = amerP(A.moneyLine);
        if (ph == null || pa == null) continue;
        const cur = o => ((o.current || {}).spread || {}).american;
        const line = { espn_id: eid, home_ml: fmtMl(H.moneyLine), away_ml: fmtMl(A.moneyLine), home_p: ph / (ph + pa), total: it.overUnder,
          over: fmtMl(it.overOdds), under: fmtMl(it.underOdds), home_rl: it.spread, home_rl_odds: cur(H), away_rl_odds: cur(A) };
        if (pid === "100") S.liveLines[g.pk] = line;
        else if (pid === "200" && g.state === "Live") S.inGame[g.pk] = line;
      }
    } catch (e) {}
  }));
}
function fmtMl(v) { if (v == null || v === "") return null; const n = +v; return isFinite(n) ? (n > 0 ? "+" + n : String(n)) : String(v); }
const PROPS = { "Home Runs Milestones": "hr", "Hits Milestones": "hit", "Total Bases Milestones": "tb" };
let lastProps = 0;
async function liveProps(sl) {
  if (Date.now() - lastProps < 14 * 60000) return;
  lastProps = Date.now();
  const map = {}; for (const pid in (sl.markets.espn_map || {})) map[sl.markets.espn_map[pid]] = +pid;
  const pre = sl.games.filter(g => g.state === "Preview" && g.mk && g.mk.dk && g.mk.dk.espn_id);
  await Promise.all(pre.map(async g => {
    const eid = g.mk.dk.espn_id;
    try {
      const u = `https://sports.core.api.espn.com/v2/sports/baseball/leagues/mlb/events/${eid}/competitions/${eid}/odds/100/propBets?limit=1000`;
      const j = await jget(u); let items = j.items || [];
      for (let p = 2; p <= (j.pageCount || 1); p++) items = items.concat((await jget(u + "&page=" + p)).items || []);
      for (const it of items) {
        const mk = PROPS[(it.type || {}).name]; if (!mk) continue;
        const m = /athletes\/(\d+)/.exec((it.athlete || {}).$ref || ""); if (!m || map[m[1]] == null) continue;
        const line = (((it.current || {}).target || {}).value); if (line == null) continue;
        const key = mk + Math.round(line); const odds = ((it.odds || {}).american || {}).value;
        (S.liveProps[map[m[1]]] = S.liveProps[map[m[1]]] || {})[key] = [odds, amerP(odds)];
      }
    } catch (e) {}
  }));
}

/* Kalshi: through the relay when one is configured (live), otherwise the file the 20-minute job writes */
function kalshiTickers(sl) {
  const pre = new Set(sl.games.filter(g => g.state === "Preview").map(g => g.pk)), out = new Set();
  for (const g of sl.games) {
    if (!pre.has(g.pk)) continue;
    const ks = (g.mk || {}).ks || {};
    Object.values(ks.win || {}).forEach(v => v[4] && out.add(v[4]));
    Object.values(ks.total || {}).forEach(v => v[3] && out.add(v[3]));
  }
  for (const w of sl.hitters.concat(sl.pitchers)) {
    if (!pre.has(w.pk)) continue;
    Object.values(((w.mk || {}).ks) || {}).forEach(v => v[3] && out.add(v[3]));
  }
  return [...out];
}
async function liveKalshi(sl) {
  if (HR.relay) {
    try {
      const t = kalshiTickers(sl), got = {};
      for (let i = 0; i < t.length; i += 100) {
        const j = await jget(`${HR.relay}/markets?limit=100&tickers=${encodeURIComponent(t.slice(i, i + 100).join(","))}`);
        for (const m of j.markets || []) got[m.ticker] = [+m.yes_bid_dollars, +m.yes_ask_dollars, +m.last_price_dollars, +m.yes_bid_size_fp, +m.yes_ask_size_fp];
      }
      if (Object.keys(got).length) { Object.assign(S.ks, got); S.ksAt = new Date().toISOString(); S.ksSrc = "relay"; return; }
    } catch (e) {}
  }
  try {
    const j = await jget(`data/kalshi.json?t=${Date.now()}`);
    if (!S.ksAt || new Date(j.as_of) > new Date(S.ksAt)) { S.ks = j.p || {}; S.ksAt = j.as_of; S.ksSrc = "file"; }
  } catch (e) {}
}
/* Polymarket answers web pages directly */
function pmTrio(m) {
  const px = JSON.parse(m.outcomePrices || "[]").map(Number);
  const b = m.bestBid == null || m.bestBid === "" ? null : +m.bestBid, a = m.bestAsk == null || m.bestAsk === "" ? null : +m.bestAsk;
  const q = (p, ask, bid) => (ask == null || ask >= 0.98 || ask <= 0) ? null : [(bid != null && bid > 0 && ask - bid <= 0.1) ? p : null, ask, bid];
  return [q(px[0], a, b), q(px[1], b != null ? 1 - b : null, a != null ? 1 - a : null)];
}
const PMK = { baseball_player_home_runs: "hr", baseball_player_hits: "hit", baseball_player_total_bases: "tb", baseball_player_strikeouts: "k" };
async function livePoly(sl) {
  const pre = sl.games.filter(g => g.state === "Preview" && g.mk && g.mk.pm && g.mk.pm.slug);
  if (!pre.length) return;
  await Promise.all(pre.map(async g => {
    try {
      const [ev] = await jget(`https://gamma-api.polymarket.com/events?slug=${g.mk.pm.slug}`);
      if (ev) for (const m of ev.markets || []) {
        if (m.closed) continue;
        const t = pmTrio(m), names = JSON.parse(m.outcomes || "[]").map(x => String(x).toLowerCase());
        if (m.sportsMarketType === "moneyline") {
          const ml = {};
          const hf = (g.home.full || g.home.name).toLowerCase(), af = (g.away.full || g.away.name).toLowerCase();
          const hl = hf.split(" ").pop(), al = af.split(" ").pop();
          names.forEach((n, i) => {
            const last = n.split(" ").pop();
            if (n === hf || (hl !== al && last === hl)) ml.home = t[i];
            else if (n === af || (hl !== al && last === al)) ml.away = t[i];
          });
          S.pmMl[g.pk] = ml; S.pmTok[m.slug] = m.clobTokenIds;
        } else if (m.sportsMarketType === "totals" && m.line != null) {
          (S.pmTot[g.pk] = S.pmTot[g.pk] || {})[String(+m.line)] = { over: t[0], under: t[1] }; S.pmTok[m.slug] = m.clobTokenIds;
        }
      }
      if (g.mk.pm.props_slug) {
        const [pe] = await jget(`https://gamma-api.polymarket.com/events?slug=${g.mk.pm.props_slug}`);
        if (pe) for (const m of pe.markets || []) if (PMK[m.sportsMarketType] && !m.closed) { const t = pmTrio(m); if (t[0]) { S.pm[m.slug] = t[0]; S.pmTok[m.slug] = m.clobTokenIds; } }
      }
    } catch (e) {}
  }));
  S.pmAt = new Date().toISOString();
}
let busy = false;
async function refresh(force) {
  if (!HR || busy) return;
  const sl = slate();
  if (!force && document.hidden) return;
  busy = true; S.live.state = "busy"; renderShell();
  try {
    const games = await liveSchedule(sl);
    await Promise.allSettled([liveWeather(sl), liveHomers(sl, games), liveOdds(sl), liveProps(sl), liveKalshi(sl), livePoly(sl)]);
    compute(sl);
    S.live = { state: "ok", at: new Date().toISOString() };
  } catch (e) {
    S.live = { state: "err", at: S.live.at, err: String(e) };
  }
  busy = false;
  const a = document.activeElement; const keep = a && a.id === "q";
  render();
  if (keep) { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

/* ============================================================ boot */
(function boot() {
  const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
  if (!HR) { render(); return; }
  HR.slates.forEach(compute);
  // after the last game of the day has ended, open on tomorrow
  const s0 = HR.slates[0];
  if (HR.slates.length > 1 && s0.games.every(g => g.state === "Final" || /Postpone|Cancel/i.test(g.status))) S.day = 1;
  render();
  refresh(true);
  setInterval(() => refresh(false), 5 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && (!S.live.at || Date.now() - new Date(S.live.at) > 4 * 60000)) refresh(false); });
})();
</script>
